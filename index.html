<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agência Real — escritório vivo de agentes de IA</title>
  <meta name="description" content="Sua agência de verdade: funcionários são agentes de IA reais executando projetos reais, com CRM, financeiro, rotinas 24/7 e fluxos — num escritório isométrico animado." />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/painel.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#141c2b" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
</head>
<body>
  <!-- ===== HUD superior (só informações reais) ===== -->
  <header id="hud" class="hud hidden">
    <div class="hud-left">
      <div class="brand">🏢 <span id="companyName">Minha Agência</span></div>
      <div class="tier-badge" id="tierBadge">🏢 Escritório</div>
    </div>
    <div class="hud-stats">
      <div class="stat stat-money" title="Caixa real (recebimentos − custos)">
        <span class="stat-icon">💵</span>
        <span class="stat-val" id="statMoney">R$ 0</span>
      </div>
      <div class="stat" title="Data e hora reais">
        <span class="stat-icon">📅</span>
        <span class="stat-val" id="statDay">—</span>
      </div>
    </div>
    <div class="hud-right">
      <button id="btnMute" class="btn btn-icon" title="Som ambiente do escritório">🔊</button>
    </div>
  </header>

  <!-- ===== Layout principal ===== -->
  <main id="game" class="game hidden">
    <!-- Escritório -->
    <section class="office-panel">
      <div class="office-viewport">
        <canvas id="officeCanvas"></canvas>
      </div>
    </section>

    <!-- Coluna lateral com abas (gaveta retrátil sobre a cena) -->
    <section class="side-panel open" id="sidePanel">
      <button class="drawer-tab" id="drawerToggle" aria-label="Abrir ou fechar o painel" title="Abrir/fechar painel">›</button>
      <nav class="tabs">
        <button class="tab active" data-tab="projects">📋 Projetos</button>
        <button class="tab" data-tab="team">👥 Equipe</button>
        <button class="tab" data-tab="company">💰 Financeiro</button>
      </nav>

      <div class="tab-content">
        <!-- Projetos reais (rotinas e fluxos inclusos) -->
        <div class="tab-pane active" id="tab-projects">
          <div id="realProjetos" class="painel-real"></div>
        </div>

        <!-- Equipe de agentes + times -->
        <div class="tab-pane" id="tab-team">
          <div id="realEquipe" class="painel-real"></div>
        </div>

        <!-- Financeiro de agência (visão, CRM, contas, relatórios) -->
        <div class="tab-pane" id="tab-company">
          <div id="realFinanceiro" class="painel-real"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== Notificações ===== -->
  <div id="toasts" class="toasts"></div>

  <!-- ===== Painel de personagem (clique na cena) ===== -->
  <div id="workerCard" class="worker-card hidden"></div>

  <!-- ===== Modo Empresa Real: wizard de novo projeto (4 passos) ===== -->
  <div id="modalWizard" class="overlay hidden">
    <div class="modal modal-grande">
      <h2 id="wizardTitulo">📋 Novo projeto</h2>
      <div class="wizard-passos" id="wizardPassos"></div>
      <div id="wizardCorpo" class="wizard-corpo"></div>
      <div class="modal-actions">
        <button id="wizardVoltar" class="btn">← Voltar</button>
        <button id="wizardCancelar" class="btn">Cancelar</button>
        <button id="wizardAvancar" class="btn btn-primary">Avançar →</button>
      </div>
      <p class="modal-hint" id="wizardErro"></p>
    </div>
  </div>

  <!-- ===== Modo Empresa Real: contratar/editar funcionário ===== -->
  <div id="modalFuncionario" class="overlay hidden">
    <div class="modal modal-grande">
      <h2 id="funcTitulo">👥 Contratar funcionário</h2>
      <div id="funcCorpo" class="wizard-corpo"></div>
      <div class="modal-actions">
        <button id="funcCancelar" class="btn">Cancelar</button>
        <button id="funcSalvar" class="btn btn-primary">✅ Salvar</button>
      </div>
      <p class="modal-hint" id="funcErro"></p>
    </div>
  </div>

  <!-- ===== Modo Empresa Real: atividade do projeto + chat com o funcionário ===== -->
  <div id="modalAtividade" class="overlay hidden">
    <div class="modal modal-grande">
      <h2 id="atvTitulo">📡 Atividade</h2>
      <div id="atvLinhaTempo"></div>
      <div id="atvLog" class="atv-log"></div>
      <div class="atv-chat">
        <input id="atvMensagem" class="name-input" type="text" maxlength="2000"
               placeholder="Falar com o funcionário… (Enter envia)" autocomplete="off" />
        <button id="atvEnviar" class="btn btn-primary">📨 Enviar</button>
        <button id="atvRetomar" class="btn btn-accent hidden">▶️ Retomar com este texto</button>
      </div>
      <div class="modal-actions">
        <button id="atvFechar" class="btn">Fechar</button>
      </div>
    </div>
  </div>

  <!-- ===== Modo Empresa Real: Modo TV (dashboard de parede) ===== -->
  <div id="modoTv" class="hidden">
    <button id="tvFechar" title="Sair (Esc)">✕</button>
    <div id="tvConteudo"></div>
  </div>

  <!-- ===== Ponte local desligada ===== -->
  <div id="ponteOffline" class="overlay hidden">
    <div class="modal">
      <h2>🔌 A ponte está desligada</h2>
      <p class="event-text">A agência roda 100% na sua máquina: a ponte local guarda seus dados e fala com os agentes. Rode no terminal, na pasta do projeto:</p>
      <p class="ponte-comando"><code>npm run empresa</code></p>
      <div class="modal-actions">
        <button id="btnPonteRetry" class="btn btn-primary">🔄 Tentar de novo</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
